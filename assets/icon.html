<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* 512×512 icon — the INVERTED 755 bit grid: oatmeal cells on a rust plate.
     Family of the permbits app icon (rust cells on oatmeal), clearly the
     "explained" sibling. 12% safe padding for maskable. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    background: linear-gradient(160deg, #B5461F 0%, #A83E1C 55%, #8A3115 100%);
    display: grid; place-items: center;
  }
  .grid {
    width: 384px; height: 384px; /* ~75% => >12% safe padding all round */
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 22px;
  }
  .c {
    border-radius: 26px;
    background: #F4EEE2;
    box-shadow: inset 0 -6px 0 rgba(43,36,32,0.16), 0 10px 22px -12px rgba(30,15,8,0.5);
  }
  .off {
    background: rgba(43,27,21,0.35);
    box-shadow: none;
  }
</style>
</head>
<body>
  <!-- 755 = rwx r-x r-x, inverted -->
  <div class="grid">
    <div class="c"></div><div class="c"></div><div class="c"></div>
    <div class="c"></div><div class="c off"></div><div class="c"></div>
    <div class="c"></div><div class="c off"></div><div class="c"></div>
  </div>
</body>
</html>
